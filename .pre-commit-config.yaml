# Install once with:  make hooks   (or: uv run pre-commit install)
# Run on everything:   uv run pre-commit run --all-files
#
# Python hooks are "local" and go through `uv run`, so they use exactly the versions pinned in uv.lock
# (the same ones CI uses) instead of a second, separately pinned copy of ruff / mypy.
minimum_pre_commit_version: "4.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Two trailing spaces are a hard line break in Markdown.
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]
        # The lock file is generated and legitimately large.
        exclude: ^uv\.lock$

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy
        # The project configuration ([tool.mypy] packages = ["payment_service"]) selects what is checked;
        # file names are not passed, because strict mode needs the whole package to resolve imports.
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
